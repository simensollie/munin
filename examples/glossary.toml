# Munin glossary — example
#
# Copy to ~/munin/glossary.toml and edit. You write this file; Munin reads it
# and never rewrites it (D8). `munin glossary suggest` mines your own past
# transcripts for misspellings of terms you have already defined here and
# prints them as proposed `corrections` for you to paste in. It cannot add a
# term, so an empty file yields no suggestions.
#
# It does two jobs:
#   1. Decode-time bias  — up to `prompt_budget_terms` canonical spellings are
#      put in Whisper's initial_prompt for each meeting, so the model is
#      predisposed to hear them. Cheap, but capped: initial_prompt truncates
#      silently past 224 tokens.
#   2. Post-correction   — `corrections` are applied to the finished transcript.
#      This is where most of the accuracy actually comes from.
#
# ALL NAMES BELOW ARE SYNTHETIC. Replace them with your own.

version = 1

[settings]
# How many canonical terms may enter initial_prompt per meeting. Terms are
# chosen by weight, with anything promoted by [[context]] first.
prompt_budget_terms = 40

# What to do with a correction that has no explicit `action`.
#   always — replace without asking
#   review — collect for the LLM review pass, do not replace blindly
#   never  — record the mapping but never act on it
default_action = "review"

# Corrections match on whole words by default. Set false for terms that appear
# glued to other tokens (rare; mostly acronyms inside slashes or hyphens).
word_boundary = true


# ─── Products ────────────────────────────────────────────────────────────────

# The hard case: an English product name with a near-homophone in Norwegian.
# Speakers say it correctly; the recogniser hears the Norwegian word.
[[term]]
canonical   = "Beacon"
kind        = "product"
weight      = 95
languages   = ["no", "en"]
corrections = ["Bekken", "bekken", "BEKKEN", "BEK"]
action      = "always"
notes       = "Norwegian homophone. In the 204-file corpus the wrong forms outnumber the right one roughly 1:2."

# Letters + 365 never survives at all — the digits get re-spoken as words and
# the recogniser picks a different expansion each time.
[[term]]
canonical   = "Beacon 365"
kind        = "product"
weight      = 95
languages   = ["no", "en"]
corrections = [
  "Beacon 3.65",
  "Beacon 360",
  "bacon 365",
  "Beacon three sixty five",
  "beacon tre seksti fem",
]
action      = "always"
notes       = "Zero correct occurrences in the corpus. Must be caught in post-correction; biasing alone does not fix it."


# ─── Customers ───────────────────────────────────────────────────────────────

# A five-letter acronym. Worst observed class: six spellings across 342
# occurrences, with the correct form a small minority.
[[term]]
canonical   = "NORVA"
kind        = "customer"
weight      = 90
languages   = ["no", "en"]
corrections = ["Norva", "norva", "NORVAK", "Norwa", "NOVA", "Nordva"]
action      = "always"
domains     = ["norva.example"]   # attendees on this domain promote these terms

# A short Norwegian proper noun that collides with a common noun.
[[term]]
canonical   = "Bergli"
kind        = "customer"
weight      = 85
languages   = ["no"]
corrections = ["berglig", "Berg li", "Berlin"]
action      = "review"
domains     = ["bergli.example"]
notes       = "\"Berlin\" is a real word in other contexts — review rather than replace."


# ─── Domain vocabulary ───────────────────────────────────────────────────────

[[term]]
canonical   = "avvik"
kind        = "domain"
weight      = 80
languages   = ["no"]
corrections = ["Avik", "AVX", "AVIX"]
action      = "always"
notes       = "Do NOT add \"Havik\" here — see [[protect]] below."

[[term]]
canonical   = "ISO 42001"
kind        = "standard"
weight      = 75
languages   = ["no", "en"]
corrections = ["ISO 4200", "ISO 3200", "ISO 2389", "ISO 42 001"]
action      = "always"
notes       = "Half of all mentions in the corpus came out as ISO 4200."

[[term]]
canonical   = "ISO 27001"
kind        = "standard"
weight      = 70
languages   = ["no", "en"]
corrections = ["ISO 2700", "ISO 27 001"]
action      = "review"
notes       = "\"ISO 2700\" is ambiguous: a truncated 27001, or a mangled 42001. Never auto-replace."

[[term]]
canonical   = "ISO 9001"
kind        = "standard"
weight      = 60
languages   = ["no", "en"]
corrections = ["ISO 900", "ISO 90 01"]

[[term]]
canonical   = "Claude Code"
kind        = "tool"
weight      = 55
languages   = ["no", "en"]
corrections = ["Cloud Code", "klod", "Klodd", "Claude kode"]
action      = "always"


# ─── People ──────────────────────────────────────────────────────────────────
#
# Generated from calendar attendees and the directory. Weight is raised
# automatically for people you meet often. These also feed closed-set speaker
# assignment (§7.4 tier 3), so the spelling here is the spelling in transcripts.

[[term]]
canonical   = "Ola Nordmann"
kind        = "person"
weight      = 50
email       = "ola@example.no"
corrections = ["Ola Nordman", "Ola Nordmand", "Ola Nordmenn"]
action      = "always"

[[term]]
canonical   = "Kari Nordmann"
kind        = "person"
weight      = 50
email       = "kari@example.no"
corrections = ["Kari Nordman", "Karin Ordmann"]
action      = "always"


# ─── Protected strings ───────────────────────────────────────────────────────
#
# Never rewritten by any rule, and never offered as a correction target. This is
# how you stop a correct but unusual word being "fixed" into something else.

[[protect]]
text   = "Havik"
reason = "A surname. Without this it gets swallowed by the avvik rule."

[[protect]]
text   = "Nordmann"
reason = "Both a surname and a common noun; the person rules already handle it."


# ─── Context promotion ───────────────────────────────────────────────────────
#
# When a meeting matches, the listed terms jump to the front of the
# prompt_budget_terms queue for that meeting only. This is what makes a 40-term
# budget enough: you do not need every customer in every meeting, only the ones
# actually in the room.

[[context]]
when_attendee_domain = "norva.example"
promote = ["NORVA", "Beacon 365"]

[[context]]
when_title_matches = "(?i)audit|revisjon"
promote = ["ISO 9001", "ISO 27001", "ISO 42001", "avvik"]

[[context]]
when_title_matches = "(?i)deviation|avvik"
promote = ["avvik", "Beacon"]
